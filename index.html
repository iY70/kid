<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Square Root Custom Calculator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 22px;
    font-family: Arial, sans-serif; color: #f4f7fb;
    background: linear-gradient(135deg, #101b2d, #17434a);
  }
  .card {
    width: min(100%, 460px); padding: 28px; border-radius: 20px;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.17);
    box-shadow: 0 18px 55px rgba(0,0,0,.28);
  }
  h1 { margin: 0 0 8px; text-align: center; font-size: 25px; }
  .hint { margin: 0 0 24px; color: #c7d4df; text-align: center; }
  .inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
  input {
    min-width: 0; width: 100%; padding: 14px 9px; border: 1px solid #8ba0ad;
    border-radius: 11px; background: #f8fafc; color: #142333; font-size: 20px;
    text-align: center;
  }
  .plus { font-size: 24px; font-weight: bold; }
  button {
    width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 11px;
    background: #72e3b9; color: #10312b; font-size: 17px; font-weight: bold; cursor: pointer;
  }
  button:hover { background: #91f0cc; }
  .label { margin: 26px 0 6px; color: #c7d4df; text-align: center; font-size: 13px; letter-spacing: .08em; }
  #answer { min-height: 48px; text-align: center; color: #85f0c5; font-size: 36px; font-weight: 800; overflow-wrap: anywhere; }
  #steps { margin-top: 13px; padding: 14px; border-radius: 10px; background: rgba(0,0,0,.2); color: #e1ebf2; line-height: 1.7; text-align: center; overflow-wrap: anywhere; }
  .rule { margin: 15px 0 0; color: #b9c9d5; font-size: 13px; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <h1>Square Root Custom Calculator</h1>
  <p class="hint">Enter any two non-negative numbers</p>
  <div class="inputs">
    <input id="a" type="number" min="0" step="any" value="600" placeholder="First number" aria-label="First number">
    <span class="plus">+</span>
    <input id="b" type="number" min="0" step="any" value="400" placeholder="Second number" aria-label="Second number">
  </div>
  <button id="go">Calculate</button>
  <p class="label">CUSTOM ANSWER</p>
  <div id="answer">45.49489743</div>
  <div id="steps">√600 + √400 + 1<br>24.49489743 + 20 + 1 = 45.49489743</div>
  <p class="rule">Rule: √first number + √second number + 1</p>
</main>
<script>
  const aInput = document.getElementById('a');
  const bInput = document.getElementById('b');
  const answer = document.getElementById('answer');
  const steps = document.getElementById('steps');

  function fmt(n) {
    return Number(n.toFixed(8)).toString();
  }

  function calculate() {
    const rawA = aInput.value.trim();
    const rawB = bInput.value.trim();
    if (!rawA || !rawB) {
      answer.textContent = 'Enter both numbers';
      steps.textContent = '';
      return;
    }
    const a = Number(rawA), b = Number(rawB);
    if (!Number.isFinite(a) || !Number.isFinite(b) || a < 0 || b < 0) {
      answer.textContent = 'Invalid input';
      steps.textContent = 'Please enter valid non-negative numbers.';
      return;
    }
    const ra = Math.sqrt(a), rb = Math.sqrt(b);
    const result = ra + rb + 1;
    answer.textContent = fmt(result);
    steps.innerHTML = `√${fmt(a)} + √${fmt(b)} + 1<br>${fmt(ra)} + ${fmt(rb)} + 1 = ${fmt(result)}`;
  }

  document.getElementById('go').addEventListener('click', calculate);
  [aInput, bInput].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') calculate();
  }));
  calculate();
</script>
</body>
</html>
