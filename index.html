
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Square Root Calculator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
  font-family: 'Segoe UI', Arial, sans-serif;
  color: #263653;
  background: linear-gradient(135deg, #e6f0ff, #f4eaff, #e2faff);
}

.card {
  width: min(100%, 490px);
  padding: 28px;
  border-radius: 24px;
  background: white;
  border: 1px solid #fff;
  box-shadow: 0 15px 50px rgba(75, 95, 160, .14);
}

h1 {
  text-align: center;
  color: #536bd0;
  font-size: 26px;
  margin: 0 0 8px;
}

.hint {
  text-align: center;
  color: #8b98ac;
  margin: 0 0 25px;
  font-size: 14px;
}

.section-label {
  display: block;
  margin: 19px 0 9px;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .7px;
  color: #7786a2;
}

.inputs {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 9px;
  align-items: center;
}

.operation-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

input, select {
  width: 100%;
  min-width: 0;
  padding: 14px 9px;
  border: 2px solid #e6ebf6;
  border-radius: 12px;
  background: #f8faff;
  color: #33466d;
  font-size: 16px;
  text-align: center;
  outline: none;
}

input:focus, select:focus {
  border-color: #8798ef;
  background: white;
}

.plus {
  color: #8193d7;
  font-size: 23px;
  font-weight: bold;
}

.step-card {
  padding: 16px;
  margin-top: 15px;
  border-radius: 15px;
  background: #f5f7ff;
  border: 1px solid #e8ebfc;
}

.step-title {
  font-size: 13px;
  font-weight: 800;
  color: #6679ce;
  margin-bottom: 12px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(100deg, #6688f5, #9674e9);
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

.result-box {
  margin-top: 25px;
  padding: 22px 12px;
  text-align: center;
  border-radius: 17px;
  background: linear-gradient(120deg, #edf2ff, #f5edff);
}

.result-label {
  color: #8390b1;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}

#answer {
  color: #6175df;
  font-size: clamp(27px, 7vw, 38px);
  font-weight: 800;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

.steps-box {
  margin-top: 16px;
  padding: 16px;
  border-radius: 13px;
  background: #fbfcff;
  border: 1px solid #e9edf6;
  text-align: center;
  line-height: 2;
  font-size: 14px;
  color: #5c6c87;
  overflow-wrap: anywhere;
}

.rule {
  text-align: center;
  margin-top: 18px;
  color: #98a4b9;
  font-size: 12px;
}

@media(max-width: 380px) {
  .card { padding: 19px; }
}
</style>
</head>

<body>

<main class="card">

<h1>√ Smart Calculator</h1>
<p class="hint">Advanced Custom Calculation</p>

<label class="section-label">FIRST TWO NUMBERS</label>

<div class="inputs">
  <input id="a" type="number" min="0" step="any" value="600">
  <span class="plus">+</span>
  <input id="b" type="number" min="0" step="any" value="400">
</div>

<div class="step-card">
  <div class="step-title">⚙️ FIRST OPERATION</div>
  <div class="operation-row">
    <select id="op1">
      <option value="+">+ Addition</option>
      <option value="-">− Subtraction</option>
      <option value="*">× Multiplication</option>
      <option value="/">÷ Division</option>
    </select>

    <input id="c1" type="number" step="any" value="1"
      placeholder="Custom number">
  </div>
</div>

<div class="step-card">
  <div class="step-title">✨ SECOND OPERATION (ON RESULT)</div>
  <div class="operation-row">
    <select id="op2">
      <option value="/">÷ Division</option>
      <option value="*">× Multiplication</option>
      <option value="+">+ Addition</option>
      <option value="-">− Subtraction</option>
    </select>

    <input id="c2" type="number" step="any" value="1"
      placeholder="Custom number">
  </div>
</div>

<button id="go">Calculate Final Result ✨</button>

<div class="result-box">
  <div class="result-label">FINAL ANSWER</div>
  <div id="answer">46.49489743</div>
</div>

<div class="steps-box" id="steps"></div>

<p class="rule">
  Formula: (√A + √B) Operation 1 Operation 2
</p>

</main>

<script>
const $ = id => document.getElementById(id);

function fmt(n) {
  return Number(n.toFixed(8)).toString();
}

function applyOperation(value, operator, custom) {
  switch(operator) {
    case '+': return value + custom;
    case '-': return value - custom;
    case '*': return value * custom;
    case '/': return custom === 0 ? null : value / custom;
  }
}

function calculate() {
  const a = $('a').value.trim();
  const b = $('b').value.trim();
  const c1 = $('c1').value.trim();
  const c2 = $('c2').value.trim();

  if (!a || !b || !c1 || !c2) {
    $('answer').textContent = 'Fill all fields';
    $('steps').textContent = '';
    return;
  }

  const A = Number(a);
  const B = Number(b);
  const C1 = Number(c1);
  const C2 = Number(c2);

  if (
    ![A,B,C1,C2].every(Number.isFinite) ||
    A < 0 || B < 0
  ) {
    $('answer').textContent = 'Invalid Input';
    $('steps').textContent = 'Enter valid numbers. A and B must be non-negative.';
    return;
  }

  const op1 = $('op1').value;
  const op2 = $('op2').value;

  const rootA = Math.sqrt(A);
  const rootB = Math.sqrt(B);

  const base = rootA + rootB;

  const result1 = applyOperation(base, op1, C1);

  if (result1 === null) {
    $('answer').textContent = 'Cannot divide by zero';
    $('steps').textContent = 'First custom number cannot be zero for division.';
    return;
  }

  const result2 = applyOperation(result1, op2, C2);

  if (result2 === null) {
    $('answer').textContent = 'Cannot divide by zero';
    $('steps').textContent = 'Second custom number cannot be zero for division.';
    return;
  }

  if (!Number.isFinite(result1) || !Number.isFinite(result2)) {
    $('answer').textContent = 'Result too large';
    $('steps').textContent = 'Please use smaller numbers.';
    return;
  }

  $('answer').textContent = fmt(result2);

  $('steps').innerHTML = `
    <b>STEP 1: Square Roots</b><br>
    √${fmt(A)} + √${fmt(B)}<br>
    ${fmt(rootA)} + ${fmt(rootB)} = ${fmt(base)}
    <br><br>

    <b>STEP 2: First Operation</b><br>
    ${fmt(base)} ${op1} ${fmt(C1)} = ${fmt(result1)}
    <br><br>

    <b>STEP 3: Second Operation</b><br>
    ${fmt(result1)} ${op2} ${fmt(C2)} = <b>${fmt(result2)}</b>
  `;
}

$('go').addEventListener('click', calculate);

['a','b','c1','c2','op1','op2'].forEach(id => {
  $(id).addEventListener('keydown', e => {
    if(e.key === 'Enter') calculate();
  });
  $(id).addEventListener('change', calculate);
});

calculate();
</script>

</body>
</html>
